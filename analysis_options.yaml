include: package:very_good_analysis/analysis_options.6.0.0.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/generated_plugin_registrant.dart"
    - "lib/l10n/**"
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Comments inside functions / methods are fine when explaining non-obvious WHY.
    # We still want documentation_comments where they matter (public API), but not as errors.
    public_member_api_docs: ignore
    # Allow ASCII art / long lines inside dartdoc.
    lines_longer_than_80_chars: ignore

linter:
  rules:
    # Project-specific tweaks on top of very_good_analysis defaults.
    prefer_relative_imports: true
    sort_pub_dependencies: false
    avoid_redundant_argument_values: false
    flutter_style_todos: false
