name: muslim_guider_pro
description: "Live Athan Broadcasting Platform — listener client."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.6.2

  # Models & serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Fonts & icons (prototype design system)
  google_fonts: ^6.2.1
  material_symbols_icons: ^4.2783.0

  # Utilities
  intl: any
  shared_preferences: ^2.3.2
  collection: ^1.18.0

  # Iconography fallback
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Lint
  very_good_analysis: ^6.0.0

  # Code generation
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.3
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  custom_lint: ^0.7.0
  riverpod_lint: ^2.6.1

flutter:
  uses-material-design: true

  # Fonts are loaded via google_fonts at runtime; no asset font declarations needed.
  # When we have real fixture JSON / images, add an `assets:` block here.
